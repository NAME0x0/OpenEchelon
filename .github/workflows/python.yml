name: Python

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "spikes/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "spikes/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run --with mypy mypy

      - name: Tests
        run: uv run pytest -q

  spike:
    name: Resource Governor spike
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run the spike
        # The measured figures are pinned by tests/test_spike.py. This step
        # exists so the numbers appear in the run log, where a reviewer can see
        # what a change did to false accepts and cost without reading a diff.
        run: |
          uv run python spikes/resource_governor/run.py
          uv run python spikes/resource_governor/run.py --control
