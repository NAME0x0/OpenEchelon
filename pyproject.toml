[project]
name = "openechelon"
version = "0.0.0"
description = "A model-agnostic runtime for structured AI organizations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "ai-agents",
    "multi-agent-systems",
    "agent-orchestration",
    "llm-orchestration",
    "hierarchical-agents",
    "model-agnostic",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/NAME0x0/OpenEchelon"
Documentation = "https://github.com/NAME0x0/OpenEchelon/tree/main/docs"
Repository = "https://github.com/NAME0x0/OpenEchelon"
Changelog = "https://github.com/NAME0x0/OpenEchelon/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openechelon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "spikes", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["openechelon", "spikes"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "spikes"]
plugins = ["pydantic.mypy"]
